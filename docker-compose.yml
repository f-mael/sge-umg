services:
  db:
    image: postgres:16-alpine
    container_name: sge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestion_escolar
    ports:
      - "5432:5432"
    volumes:
      - sge_pgdata:/var/lib/postgresql/data

volumes:
  sge_pgdata: